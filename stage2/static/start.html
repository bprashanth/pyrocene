<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pyrocene</title>
<style>
  :root{color-scheme:dark;--ink:#ece9dc;--muted:#9ca7a1;--amber:#e9b96e;--bg:#030605}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:ui-sans-serif,system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center}
  main{width:min(1180px,90vw);padding:56px 0}
  small{color:var(--amber);font:700 11px ui-monospace,monospace;letter-spacing:.18em}
  h1{font:400 clamp(26px,3.4vw,44px) Georgia,serif;margin:14px 0 40px;color:var(--ink)}
  .grid{display:grid;gap:22px;
        grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .tile{border:1px solid var(--amber);aspect-ratio:1;padding:22px;
        display:flex;flex-direction:column;justify-content:space-between;
        text-decoration:none;color:var(--ink);background:transparent;
        transition:background .15s,border-color .15s}
  a.tile:hover,a.tile:focus-visible{background:#e9b96e12;outline:none}
  /* A tile that is entirely one link has nothing at its foot, so centre the
     title rather than leaving it stranded above empty space. */
  a.tile{justify-content:center}
  .tile h2{font:400 22px Georgia,serif;margin:0}
  .ways{display:flex;flex-direction:column;gap:9px;margin:0}
  .ways a{color:var(--muted);text-decoration:none;font-size:14px;
          border-bottom:1px solid transparent;align-self:flex-start}
  .ways a:hover,.ways a:focus-visible{color:var(--amber);border-bottom-color:var(--amber);outline:none}
  @media(max-width:520px){.tile{aspect-ratio:auto;min-height:150px}}
</style>
</head>
<body>
<main>
  <small>PYROCENE</small>
  <h1>Start playing by clicking on a level</h1>

  <div class="grid">
    <div class="tile">
      <h2>Stage 1</h2>
      <p class="ways">
        <a href="/">Player</a>
        <a href="/gm">GM</a>
        <a href="/projector">Map</a>
      </p>
    </div>

    <div class="tile">
      <h2>Stage 2</h2>
      <p class="ways">
        <a href="/">Player</a>
        <a href="/gm">GM</a>
        <a href="/projector">Map</a>
      </p>
    </div>

    <a class="tile" href="/simulation/claude/lab/?run=sample">
      <h2>Fire lab</h2>
    </a>

    <a class="tile" id="films" href="#">
      <h2>Forest structure studies</h2>
    </a>

    <a class="tile" href="https://pyrocene.netlify.app">
      <h2>Stage 3</h2>
    </a>
  </div>
</main>
<script>
  // The films are served from their own port on this same machine. Build the
  // link from whatever address you reached this page on, so it works over wifi,
  // over tailscale or on the laptop itself without three different bookmarks.
  document.getElementById("films").href =
    location.protocol + "//" + location.hostname + ":8022/";
</script>
</body>
</html>

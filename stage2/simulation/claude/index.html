<!doctype html>
<meta charset="utf-8">
<title>Pyrocene replay</title>
<style>
 body{margin:0;height:100vh;display:grid;place-items:center;background:#0d1117;
      color:#c9d4e0;font:15px/1.6 system-ui,sans-serif;text-align:center}
 code{background:#161b22;padding:2px 7px;border-radius:5px}
</style>
<div>
  <h1 style="letter-spacing:.3em;font-size:16px">P Y R O C E N E</h1>
  <p>Nothing built here yet.</p>
  <p id="s" style="color:#6b7a8c"></p>
</div>
<script>
  // Placeholder. Proves the folder is served and the log is reachable.
  const q = new URLSearchParams(location.search);
  const name = q.get("log") || "sample-game.json";
  fetch("/api/log?file=" + encodeURIComponent(name))
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      document.getElementById("s").textContent =
        `log loaded: ${d.rounds.length} nights, ${d.game.cols}x${d.game.rows} board, ` +
        `forest ended at ${(d.game.ending || {}).health}%`;
    })
    .catch(e => { document.getElementById("s").textContent = "could not load the log: " + e; });
</script>
